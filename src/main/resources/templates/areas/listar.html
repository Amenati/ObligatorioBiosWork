<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragmentos/plantilla-maestra-consultores::html(~{::title}, ~{::body})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Áreas</title>
</head>
<body th:remove="tag">
    <h1 class="title-form listados">Áreas</h1>
    <form id="busqueda" class="listados">
        <div>
            <input type="search" name="filtro" th:value="${param.filtro}" id="filtro" placeholder="código de area"> <input type="submit" value="Buscar" class="input-button">
        </div>
    </form>
    <p><a th:href="@{/areas/ingresar}" title="Ingresar"><i class="icono icono-ingresar listados"></i></a></p>
    <table  th:unless="${areas.empty}" class="listados listado-table">
        <tr>
            <th>Código</th>
            <th>Nombre</th>
        </tr>
        <tr th:each="a : ${areas}">
            <td th:text="${a.id}"></td>
            <td th:text="${a.nombre}"></td>
            <td>
                <a th:href="@{/areas/{id}(id=${a.id})}" title="Ver Detalle"><i class="icono icono-detalle"></i></a>&nbsp;&nbsp;
                <a th:href="@{/areas/modificar(id=${a.id})}" title="Modificar"><i class="icono icono-editar"></i></a>&nbsp;&nbsp;
                <a th:href="@{/areas/eliminar(id=${a.id})}" title="Eliminar"><i class="icono icono-eliminar"></i></a>
            </td>
        </tr>
        <tr>
            <td colspan="2" class="paginacion">
                <a th:unless="${areas.first}" th:href="@{/areas(filtro=${param.filtro}, orden=${param.orden} ?: 'id,asc', pagina = ${areas.number} - 1, tamanoPagina = ${param.tamanoPagina})}">&lsaquo; anterior</a>
                <span th:unless="${areas.first} or ${areas.last}"> | </span>
                <a th:unless="${areas.last}" th:href="@{/areas(filtro=${param.filtro}, orden=${param.orden} ?: 'id,asc', pagina = ${areas.number} + 1, tamanoPagina = ${param.tamanoPagina})}">siguiente &rsaquo; </a>
            </td>
        </tr>
        <tr>
            <td colspan="2">
                Cantidad de áreas: <span th:text="${areas.numberOfElements}"></span> de <span th:text="${areas.totalElements}"></span>
            </td>
        </tr>
    </table>
    <p th:if="${areas.empty}" style="padding: 10px;">No se encontraron datos</p>
    <p th:replace="~{fragmentos/mensaje}"></p>

    <script>
        document.getElementById('busqueda').addEventListener('search', function() {
            document.getElementById('busqueda').submit();
        });

        document.getElementById('filtro').focus();
        document.getElementById('filtro').select();
    </script>
</body>
</html>
