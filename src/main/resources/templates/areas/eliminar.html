<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragmentos/plantilla-maestra-consultores::html(~{::title}, ~{::body})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Áreas</title>
</head>
<body th:remove="tag">
    <form th:action="@{/areas/eliminar}" method="post" th:object="${area}" class="formCrud">
        <div>
            <h1 class="title-form">Eliminar área</h1>
        </div>
        <div>
            <label for="id">Id</label>
            <input type="text" th:field="*{id}" class="input-text" readonly>
        </div>
        <div>
            <label for="nombre">Área</label>
            <input type="text" th:field="*{nombre}" class="input-text" readonly>
            <p th:errors="*{nombre}" style="color: red; font-size: 12px;"></p>
        </div>
        <div>
            <input type="submit" value="Eliminar" class="input-button">
        </div>
    </form>

    <p th:if="${mensaje}" th:utext="${mensaje}"></p>
</body>
</html>
