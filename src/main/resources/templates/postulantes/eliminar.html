<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragmentos/plantilla-maestra-postulantes::html(~{::title}, ~{::body})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postulantes</title>
</head>
<body th:remove="tag">
    <form th:action="@{/postulantes/eliminar}" method="post" th:object="${postulante}" class="formCrud">
        <div>
            <h1 class="title-form">Eliminar postulante</h1>
        </div>
        <div>
            <label for="usuario">Usuario</label>
            <input type="text" th:field="*{usuario}" class="input-text" readonly>
        </div>
        <div>
            <input type="submit" value="Eliminar" class="input-button">
        </div>
    </form>

    <p th:if="${mensaje}" th:utext="${mensaje}"></p>
</body>
</html>
