<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragmentos/plantilla-maestra-postulantes::html(~{::title}, ~{::body})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postulantes</title>
</head>
<body th:remove="tag">
    <form th:action="@{/postulantes/ingresar}" method="post" th:object="${postulante}" class="formCrud">
        <div>
            <h1 class="title-form">Nuevo postulante</h1>
        </div>
        <div>
            <label for="nombreUsuario">Usuario</label>
            <input type="text" th:field="*{nombreUsuario}" class="input-text">
            <p th:errors="*{nombreUsuario}" style="color: red; font-size: 12px;"></p>
        </div>
        <div>
            <label for="contrasena">Contraseña</label>
            <input type="text" th:field="*{contrasena}" class="input-text">
            <p th:errors="*{contrasena}" style="color: red; font-size: 12px;"></p>
        </div>
        <div>
            <label for="cedula">Cédula</label>
            <input type="text" th:field="*{cedula}" class="input-text">
        </div>
        <div>
            <label for="nombre">Nombre</label>
            <input type="text" th:field="*{nombre}" class="input-text">
            <p th:errors="*{nombre}" style="color: red; font-size: 12px;"></p>
        </div>
        <div>
            <label for="fechaNacimiento">Fecha de nacimiento</label>
            <input type="date" th:field="*{fechaNacimiento}" class="input-text">
            <p th:errors="*{fechaNacimiento}" style="color: red; font-size: 12px;"></p>
        </div> 
        <div>
            <label for="departamentoResidencia">Departamento</label>
            <input type="text" th:field="*{departamentoResidencia}" class="input-text">
            <p th:errors="*{departamentoResidencia}" style="color: red; font-size: 12px;"></p>
        </div>
        <div>
            <label for="fotografía">Foto</label>
            <input type="image" th:field="*{fotografía}" class="input-text">
            <p th:errors="*{fotografía}" style="color: red; font-size: 12px;"></p>
        </div> 
        <div>
            <label for="curriculum">Curriculum</label>
            <input type="file" th:field="*{curriculum}" class="input-text">
            <p th:errors="*{curriculum}" style="color: red; font-size: 12px;"></p>
        </div>                 
        <div>
            <input type="submit" value="Ingresar" class="input-button">
        </div>
    </form>

    <p th:if="${mensaje}" th:utext="${mensaje}"></p>
</body>
</html>
